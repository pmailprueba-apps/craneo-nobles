<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Craneo Noble — Intro</title>
  <style>
    @font-face {
      font-family: 'Fraunces';
      src: url('fonts/fraunces.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Instrument Sans';
      src: url('fonts/instrument-sans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: #0C0C0C;
      color: #F2EBE0;
      font-family: 'Instrument Sans', sans-serif;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* Fondo: glow radial dorado sutil */
    #glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1400px;
      height: 1400px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(201,169,110,0.20) 0%, rgba(201,169,110,0.06) 40%, rgba(12,12,12,0) 70%);
      opacity: 0;
    }

    #vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: radial-gradient(ellipse at center, rgba(12,12,12,0) 40%, rgba(12,12,12,0.85) 100%);
      opacity: 0;
    }

    /* Logo container */
    #logo-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 700px;
      height: 875px; /* 800:1000 aspect */
      transform: translate(-50%, -58%);
      opacity: 0;
    }
    #logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Shimmer sweep sobre el logo */
    #shimmer {
      position: absolute;
      top: -10%;
      left: -120%;
      width: 120%;
      height: 120%;
      background: linear-gradient(105deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0) 38%,
        rgba(255,246,220,0.35) 50%,
        rgba(255,255,255,0) 62%,
        rgba(255,255,255,0) 100%);
      transform: skewX(-12deg);
      opacity: 0;
      mix-blend-mode: screen;
    }

    /* Wordmark */
    #wordmark {
      position: absolute;
      bottom: 300px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 118px;
      letter-spacing: 0.08em;
      line-height: 1;
      color: #F2EBE0;
      opacity: 0;
    }
    #wordmark .accent { color: #C9A96E; }

    #tagline {
      position: absolute;
      bottom: 210px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 400;
      font-size: 34px;
      letter-spacing: 10px;
      text-transform: uppercase;
      color: #8A8885;
      opacity: 0;
    }

    #rule {
      position: absolute;
      bottom: 250px;
      left: 50%;
      width: 160px;
      height: 3px;
      background-color: #C9A96E;
      transform: translateX(-50%) scaleX(0);
      opacity: 0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="root" data-width="1080" data-height="1920" data-duration="4.5" data-start="0">
    <audio id="intro-audio" src="assets/intro.m4a" data-start="0" data-duration="4.5" data-volume="0.8" data-track-index="5"></audio>
    <div id="stage">
      <div id="glow" data-layout-allow-overflow></div>
      <div id="vignette" data-layout-allow-overflow></div>
      <div id="logo-wrap">
        <img id="logo" src="assets/logo-correcto.svg" />
        <div id="shimmer"></div>
      </div>
      <div id="wordmark">CRÁNEO <span class="accent">NOBLE</span></div>
      <div id="rule"></div>
      <div id="tagline">Arte · Raíz · Carácter · Trascendencia</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const END = 4.5;

    // Glow radia
    tl.fromTo("#glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.05, duration: 2.4, ease: "sine.out" }, 0);
    tl.fromTo("#vignette", { opacity: 0 }, { opacity: 1, duration: 2.0, ease: "power1.out" }, 0.2);

    // Logo: entrada con escala + desvanecimiento
    tl.fromTo("#logo-wrap", { opacity: 0, scale: 0.82, yPercent: 6 }, { opacity: 1, scale: 1, yPercent: -8, duration: 1.6, ease: "power3.out" }, 0.25);

    // Shimmer sweep a través del logo
    tl.fromTo("#shimmer", { xPercent: -60, opacity: 0 }, { xPercent: 130, opacity: 1, duration: 1.1, ease: "power2.inOut" }, 0.9);
    tl.to("#shimmer", { opacity: 0, duration: 0.4, ease: "power1.out" }, 2.0);

    // Wordmark: palabras entran con desplazamiento horizontal (sin letterSpacing animado)
    tl.fromTo("#wordmark", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.1, ease: "power3.out" }, 1.5);
    tl.fromTo("#wordmark .accent", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 1.1, ease: "power3.out" }, 1.7);
    tl.fromTo("#rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 2.2);
    tl.fromTo("#tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9, ease: "sine.out" }, 2.6);

    // Fade out suave para enlazar con el reel (fin del intro)
    tl.to("#stage", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, END - 0.5);

    window.__timelines["root"] = tl;
  </script>
</body>
</html>
