<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Prueba Tormenta — Cráneo Noble</title>
  <style>
    @font-face {
      font-family: 'Fraunces';
      src: url('fonts/fraunces.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Instrument Sans';
      src: url('fonts/instrument-sans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: #090909;
      color: #E8E6E3;
      font-family: 'Instrument Sans', sans-serif;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    #s1 { z-index: 1; }
    #s2 { z-index: 2; opacity: 0; }
    #s3 { z-index: 3; opacity: 0; }
    #s4 { z-index: 4; opacity: 0; }

    .bg-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bgimg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: radial-gradient(circle at center, rgba(9,9,9,0.2) 0%, rgba(9,9,9,0.85) 100%),
                  linear-gradient(to bottom, rgba(9,9,9,0.3) 0%, rgba(9,9,9,0.95) 100%);
      z-index: 2;
    }

    .content-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
      z-index: 10;
    }

    .label {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #D4AF37;
      opacity: 0;
    }

    .title-serif {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: 76px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #F5F2EB;
      opacity: 0;
    }

    .title-brand {
      font-family: 'Fraunces', serif;
      font-weight: 800;
      font-size: 92px;
      line-height: 1.05;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FFFFFF;
      opacity: 0;
    }

    .rule {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #D4AF37, transparent);
      margin: 10px 0;
      opacity: 0;
    }

    .sub-clean {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #A0A0A0;
      opacity: 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="composition">
    <!-- CLIP 1: EL ORIGEN -->
    <div id="s1" class="scene">
      <div class="bg-wrap"><img id="s1-bg" class="bgimg" src="assets/foto1.jpg" data-layout-allow-overflow /></div>
      <div class="scrim"></div>
      <div class="content-center">
        <div id="s1-label" class="label">Colección Esencia</div>
        <div id="s1-title" class="title-serif">El respeto por la fuerza...</div>
        <div id="s1-rule" class="rule"></div>
      </div>
    </div>

    <!-- CLIP 2: LA TRANSICIÓN -->
    <div id="s2" class="scene">
      <div class="bg-wrap"><img id="s2-bg" class="bgimg" src="assets/foto2.jpg" data-layout-allow-overflow /></div>
      <div class="scrim"></div>
      <div class="content-center">
        <div id="s2-title" class="title-serif">...se convierte en legado.</div>
        <div id="s2-rule" class="rule"></div>
      </div>
    </div>

    <!-- CLIP 3: LA TRASCENDENCIA -->
    <div id="s3" class="scene">
      <div class="bg-wrap"><img id="s3-bg" class="bgimg" src="assets/foto3.jpg" data-layout-allow-overflow /></div>
      <div class="scrim"></div>
      <div class="content-center">
        <div id="s3-title" class="title-serif">Un espíritu que trasciende.</div>
        <div id="s3-rule" class="rule"></div>
      </div>
    </div>

    <!-- CLIP 4: LA OBRA DE ARTE FINAL -->
    <div id="s4" class="scene">
      <div class="bg-wrap"><img id="s4-bg" class="bgimg" src="assets/foto4.jpg" data-layout-allow-overflow /></div>
      <div class="scrim"></div>
      <div class="content-center">
        <div id="s4-label" class="label">Piezas Únicas</div>
        <div id="s4-title" class="title-brand">CRÁNEO NOBLE</div>
        <div id="s4-rule" class="rule"></div>
        <div id="s4-sub" class="sub-clean">Arte · Honor · Legado</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });

    // Tiempos por escena (2.5s cada una, total = 10s)
    const T0 = 0.0;
    const T1 = 2.5;
    const T2 = 5.0;
    const T3 = 7.5;
    const END = 10.0;
    const FADE = 0.4;

    // SCENE 1
    tl.fromTo("#s1-bg", { scale: 1.0 }, { scale: 1.08, duration: 2.7, ease: "sine.inOut" }, T0);
    tl.fromTo("#s1-label", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, T0 + 0.2);
    tl.fromTo("#s1-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, T0 + 0.4);
    tl.fromTo("#s1-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "sine.out" }, T0 + 0.9);

    // TRANSITION 1 -> 2
    tl.to("#s1", { opacity: 0, filter: "blur(10px)", duration: FADE, ease: "power1.inOut" }, T1 - FADE);
    tl.set("#s1", { visibility: "hidden" }, T1);
    tl.fromTo("#s2", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: FADE, ease: "power1.inOut" }, T1 - 0.1);
    tl.fromTo("#s2-bg", { scale: 1.05 }, { scale: 1.0, duration: 2.7, ease: "sine.inOut" }, T1);

    // SCENE 2
    tl.fromTo("#s2-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, T1 + 0.3);
    tl.fromTo("#s2-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "sine.out" }, T1 + 0.8);

    // TRANSITION 2 -> 3
    tl.to("#s2", { opacity: 0, filter: "blur(10px)", duration: FADE, ease: "power1.inOut" }, T2 - FADE);
    tl.set("#s2", { visibility: "hidden" }, T2);
    tl.fromTo("#s3", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: FADE, ease: "power1.inOut" }, T2 - 0.1);
    tl.fromTo("#s3-bg", { scale: 1.0 }, { scale: 1.08, duration: 2.7, ease: "sine.inOut" }, T2);

    // SCENE 3
    tl.fromTo("#s3-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, T2 + 0.3);
    tl.fromTo("#s3-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "sine.out" }, T2 + 0.8);

    // TRANSITION 3 -> 4
    tl.to("#s3", { opacity: 0, filter: "blur(10px)", duration: FADE, ease: "power1.inOut" }, T3 - FADE);
    tl.set("#s3", { visibility: "hidden" }, T3);
    tl.fromTo("#s4", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: FADE, ease: "power1.inOut" }, T3 - 0.1);
    tl.fromTo("#s4-bg", { scale: 1.06 }, { scale: 1.0, duration: 2.7, ease: "sine.inOut" }, T3);

    // SCENE 4
    tl.fromTo("#s4-label", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, T3 + 0.2);
    tl.fromTo("#s4-title", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1.0, y: 0, duration: 0.8, ease: "expo.out" }, T3 + 0.4);
    tl.fromTo("#s4-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "sine.out" }, T3 + 0.9);
    tl.fromTo("#s4-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power1.out" }, T3 + 1.1);

    // END FADE
    tl.to("#s4", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, END - 0.5);

    window.__timelines["root"] = tl;
  </script>
</body>
</html>
