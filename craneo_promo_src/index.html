<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
    <title>Cráneo Noble Promo</title>
    <!-- Use Tailwind via CDN for layout utility -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 700;
        src: url('https://fonts.gstatic.com/s/playfairdisplay/v37/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PweD_w.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 300 600;
        src: url('https://fonts.gstatic.com/s/outfit/v11/QGYyz_MVcBeNP4NJtEtq.woff2') format('woff2');
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background-color: #0C0C0C;
        color: #E8E6E3;
        font-family: 'Outfit', sans-serif;
        overflow: hidden;
        position: relative;
      }

      .hf-scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        visibility: hidden;
      }

      .playfair { font-family: 'Playfair Display', serif; }
      
      .void-bg { background-color: #0C0C0C; }
      .text-primary { color: #E8E6E3; }
      .text-gold { color: #C9A96E; }
      .text-subdued { color: #8A8885; }
    </style>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body class="void-bg">
    <!-- Root Timeline Configuration -->
    <div data-composition-id="root" data-duration="32.0" data-width="1080" data-height="1920">
      <audio id="narration" src="narration_new.wav" data-start="0" data-duration="30.9" data-track-index="0" data-volume="1"></audio>

      <!-- Beat 1: Hook -->
      <div id="beat-1-container" class="absolute top-0 left-0 w-full h-full" data-composition-id="beat-1" data-composition-src="compositions/beat-1-hook.html" data-start="0" data-duration="7.0" data-track-index="1"></div>

      <!-- Beat 2: La Revelacion -->
      <div id="beat-2-container" class="absolute top-0 left-0 w-full h-full" data-composition-id="beat-2" data-composition-src="compositions/beat-2-revelacion.html" data-start="7.0" data-duration="4.3" data-track-index="1"></div>

      <!-- Beat 3: El Detalle -->
      <div id="beat-3-container" class="absolute top-0 left-0 w-full h-full" data-composition-id="beat-3" data-composition-src="compositions/beat-3-detalle.html" data-start="11.3" data-duration="10.7" data-track-index="1"></div>

      <!-- Beat 4: La Coleccion -->
      <div id="beat-4-container" class="absolute top-0 left-0 w-full h-full" data-composition-id="beat-4" data-composition-src="compositions/beat-4-coleccion.html" data-start="22.0" data-duration="5.3" data-track-index="1"></div>

      <!-- Beat 5: El Cierre -->
      <div id="beat-5-container" class="absolute top-0 left-0 w-full h-full" data-composition-id="beat-5" data-composition-src="compositions/beat-5-cierre.html" data-start="27.3" data-duration="4.7" data-track-index="1"></div>
    </div>
  </body>
</html>
